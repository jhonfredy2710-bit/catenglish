<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff5ca8">
<title>Kitty English</title>
<style>
  :root{
    --pink:#ff8fc7;
    --pink-dark:#ff4fa2;
    --pink-darker:#e8399a;
    --bg:#fff0f6;
    --card:#ffffff;
    --text:#4a2b3a;
    --muted:#9c7c8c;
    --green:#43b06a;
    --red:#ef5350;
    --shadow:0 6px 16px rgba(232,57,154,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:24px;
  }
  header.topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    background:linear-gradient(135deg,var(--pink),var(--pink-dark));
    color:#fff;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:var(--shadow);
  }
  header.topbar h1{font-size:18px;margin:0;flex:1;font-weight:700;}
  header.topbar .back{
    background:rgba(255,255,255,0.25);
    border:none;color:#fff;font-size:18px;
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .content{padding:18px 16px;flex:1;}
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .btn{
    display:block;width:100%;
    background:linear-gradient(135deg,var(--pink),var(--pink-dark));
    color:#fff;border:none;border-radius:14px;
    padding:14px;font-size:16px;font-weight:700;
    margin-top:10px;
  }
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:#f3d9e7;color:var(--pink-darker);}
  .btn:disabled{opacity:0.5;}
  input[type=text],input[type=number]{
    width:100%;padding:12px;border-radius:12px;
    border:2px solid #f3cfe1;font-size:16px;
    margin-top:6px;background:#fff8fb;
  }
  label{font-size:13px;color:var(--muted);font-weight:600;}
  .center{text-align:center;}
  .cat-wrap{display:flex;justify-content:center;margin:10px 0;}
  .progressbar{
    background:#f6d7e8;border-radius:20px;height:14px;overflow:hidden;margin:8px 0;
  }
  .progressbar-fill{
    height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-dark));
    transition:width .4s ease;
  }
  .unit-card{
    display:flex;align-items:center;gap:12px;cursor:pointer;
  }
  .unit-badge{
    width:44px;height:44px;border-radius:50%;
    background:var(--pink);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .unit-title{font-weight:700;font-size:15px;}
  .unit-sub{font-size:12px;color:var(--muted);}
  .skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .skillbtn{
    background:#fff;border-radius:16px;padding:16px 10px;text-align:center;
    box-shadow:var(--shadow);font-weight:700;font-size:14px;
    border:2px solid transparent;
  }
  .skillbtn .icon{font-size:26px;display:block;margin-bottom:6px;}
  .skillbtn.done{border-color:var(--green);}
  .option{
    display:block;width:100%;text-align:left;
    background:#fff8fb;border:2px solid #f3cfe1;
    border-radius:12px;padding:12px;margin-top:8px;font-size:15px;
  }
  .option.correct{background:#e3f7ea;border-color:var(--green);animation:pulseGood .5s;}
  .option.wrong{background:#fde8e8;border-color:var(--red);animation:shakeBad .5s;}
  @keyframes pulseGood{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}
  @keyframes shakeBad{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .feedback{
    text-align:center;font-weight:700;margin-top:10px;font-size:16px;
    min-height:22px;
  }
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .qcounter{font-size:12px;color:var(--muted);text-align:right;margin-bottom:4px;}
  .passage{
    background:#fff8fb;border-radius:12px;padding:14px;font-size:15px;
    line-height:1.5;border:2px dashed #f3cfe1;margin-bottom:12px;
  }
  .mic-btn{
    width:90px;height:90px;border-radius:50%;
    background:linear-gradient(135deg,var(--pink),var(--pink-dark));
    color:#fff;font-size:34px;border:none;margin:14px auto;display:flex;
    align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .mic-btn.listening{animation:pulseMic 1s infinite;}
  @keyframes pulseMic{0%{box-shadow:0 0 0 0 rgba(255,79,162,.5);}70%{box-shadow:0 0 0 18px rgba(255,79,162,0);}100%{box-shadow:0 0 0 0 rgba(255,79,162,0);}}
  .transcript{
    text-align:center;font-size:15px;min-height:24px;color:var(--muted);margin-top:6px;
  }
  .speak-phrase{
    text-align:center;font-size:19px;font-weight:700;margin:6px 0;color:var(--pink-darker);
  }
  .listen-btn{
    background:#fff;border:2px solid var(--pink);color:var(--pink-darker);
    border-radius:12px;padding:14px;width:100%;font-weight:700;font-size:15px;
  }
  .catbounce{animation:bounce .6s;}
  @keyframes bounce{0%,100%{transform:translateY(0);}30%{transform:translateY(-14px) rotate(-4deg);}60%{transform:translateY(0) rotate(3deg);}}
  .level-pill{
    display:inline-block;background:#fff;color:var(--pink-darker);
    font-weight:800;font-size:12px;padding:4px 12px;border-radius:20px;
    border:2px solid var(--pink);
  }
  .lockednote{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =============== DATOS DEL CURSO (A1 -> A2) =============== */

    ],

  {

    level:"A2",
    reading:{

      questions:[
        {q:"Where did they go?", options:["The mountains","The coast","The city"], answer:1},
        {q:"Who did they visit?", options:["Their grandmother","Their teacher","Their friend"], answer:0},
        {q:"How did they travel?", options:["By car","By plane","By bus"], answer:2}
      ]
    },
    writing:[
      {sentence:"Last year I ___ to the coast.", answers:["traveled","travelled"]},

      {sentence:"It ___ a great trip.", answers:["was"]}
    ],

      {audio:"I visited my grandmother.", options:["I visited my grandmother.","I visited my grandfather.","I visited my friend."], answer:0},
      {audio:"We traveled by bus.", options:["We traveled by bus.","We traveled by car.","We traveled by plane."], answer:0},

    ],
    speaking:["I visited my grandmother.","We traveled by bus.","It was a great day."]

];
const SKILLS = [
  {key:"reading", label:"Lectura", icon:"📖"},
  {key:"writing", label:"Escritura", icon:"✍️"},
  {key:"listening", label:"Escucha", icon:"🎧"},
  {key:"speaking", label:"Habla", icon:"🗣️"}
];

/* =============== ESTADO Y PERSISTENCIA =============== */
function loadProfile(){ try{return JSON.parse(localStorage.getItem("kittyProfile"));}catch(e){return null;} }
function saveProfile(p){ localStorage.setItem("kittyProfile", JSON.stringify(p)); }
function loadProgress(){ try{return JSON.parse(localStorage.getItem("kittyProgress"))||{};}catch(e){return {};} }
function saveProgress(p){ localStorage.setItem("kittyProgress", JSON.stringify(p)); }

let state = { screen:"loading" };
let progress = loadProgress();

/* =============== SONIDOS (Web Audio, sin archivos externos) =============== */
let actx;
function getCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, start, dur, type="sine", vol=0.2){
  const ctx = getCtx();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+start);
  g.gain.setValueAtTime(vol, ctx.currentTime+start);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  o.stop(ctx.currentTime+start+dur);
}
function playCorrect(){ try{ tone(523,0,0.12); tone(659,0.12,0.12); tone(784,0.24,0.18);}catch(e){} }
function playWrong(){ try{ tone(220,0,0.15,"sawtooth",0.15); tone(160,0.15,0.22,"sawtooth",0.15);}catch(e){} }

/* =============== SVG GATO ROSA (logo/mascota) =============== */
function catSVG(size=90, cls=""){
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="58" rx="34" ry="30" fill="#ff8fc7"/>
    <path d="M22 40 L14 14 L38 32 Z" fill="#ff8fc7"/>
    <path d="M78 40 L86 14 L62 32 Z" fill="#ff8fc7"/>
    <path d="M22 40 L18 22 L34 33 Z" fill="#ffd6ea"/>
    <path d="M78 40 L82 22 L66 33 Z" fill="#ffd6ea"/>
    <circle cx="36" cy="55" r="6" fill="#4a2b3a"/>
    <circle cx="64" cy="55" r="6" fill="#4a2b3a"/>
    <circle cx="38" cy="53" r="1.8" fill="#fff"/>
    <circle cx="66" cy="53" r="1.8" fill="#fff"/>

    <path d="M50 69 Q46 75 40 71" stroke="#4a2b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M50 69 Q54 75 60 71" stroke="#4a2b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="4" y2="57" stroke="#4a2b3a" stroke-width="1.5"/>
    <line x1="20" y1="65" x2="4" y2="66" stroke="#4a2b3a" stroke-width="1.5"/>
    <line x1="80" y1="60" x2="96" y2="57" stroke="#4a2b3a" stroke-width="1.5"/>
    <line x1="80" y1="65" x2="96" y2="66" stroke="#4a2b3a" stroke-width="1.5"/>
  </svg>`;
}

/* =============== TTS / STT =============== */
function speakEnglish(text){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.92;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function startRecognition(onResult, onError){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new Rec();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = (e)=> onResult(e.results[0][0].transcript);
  rec.onerror = (e)=> onError(e.error);
  rec.onend = ()=> { if(state._listening){ state._listening=false; render(); } };
  rec.start();
  return rec;
}
function similarity(a,b){
  a = a.toLowerCase().replace(/[^a-z ]/g,"").trim();
  b = b.toLowerCase().replace(/[^a-z ]/g,"").trim();
  const wa = a.split(" ").filter(Boolean);
  const wb = b.split(" ").filter(Boolean);
  if(wb.length===0) return 0;
  let hit=0;
  wb.forEach(w=>{ if(wa.includes(w)) hit++; });
  return hit/wb.length;
}

/* =============== PROGRESO =============== */
function markDone(unitIdx, skillKey){
  const key = unitIdx+"-"+skillKey;
  progress[key] = true;
  saveProgress(progress);
}
function isDone(unitIdx, skillKey){ return !!progress[unitIdx+"-"+skillKey]; }
function totalDone(){ return Object.keys(progress).length; }
function totalActivities(){ return UNITS.length*SKILLS.length; }
function levelLabel(){
  const pct = totalDone()/totalActivities();
  if(pct>=1) return "¡Nivel A2 alcanzado! 🎉";
  if(pct>=0.5) return "Nivel A2 en progreso";
  return "Nivel A1 en progreso";
}

/* =============== RENDER =============== */
const app = document.getElementById("app");
function render(){
  if(state.screen==="loading") return renderLoading();
  if(state.screen==="onboarding") return renderOnboarding();
  if(state.screen==="home") return renderHome();
  if(state.screen==="unit") return renderUnitMenu();
  if(state.screen==="reading") return renderReading();
  if(state.screen==="writing") return renderWriting();
  if(state.screen==="listening") return renderListening();
  if(state.screen==="speaking") return renderSpeaking();
  if(state.screen==="result") return renderResult();
}

function renderLoading(){
  app.innerHTML = `<div class="content center" style="padding-top:80px;">
    <div class="cat-wrap">${catSVG(120)}</div>
    <h2>Kitty English</h2>
    <p style="color:var(--muted)">Cargando...</p>
  </div>`;
  setTimeout(()=>{
    const profile = loadProfile();
    state.screen = profile ? "home" : "onboarding";
    render();
  }, 600);
}

function renderOnboarding(){
  app.innerHTML = `
    <header class="topbar"><h1>Kitty English</h1></header>
    <div class="content">
      <div class="card center">
        <div class="cat-wrap">${catSVG(110)}</div>
        <h2 style="margin:6px 0;">¡Bienvenido! 🐾</h2>
        <p style="color:var(--muted);font-size:14px;">Aprende inglés americano de A1 a A2 practicando lectura, escritura, escucha y habla.</p>
        <div style="text-align:left;margin-top:10px;">
          <label>Tu nombre</label>
          <input type="text" id="inpName" placeholder="Ej: Laura">
        </div>
        <div style="text-align:left;margin-top:10px;">
          <label>Tu edad</label>
          <input type="number" id="inpAge" placeholder="Ej: 24" min="1" max="99">
        </div>
        <button class="btn" id="btnStart" disabled>Empezar</button>
      </div>
    </div>`;
  const name = document.getElementById("inpName");
  const age = document.getElementById("inpAge");
  const btn = document.getElementById("btnStart");
  function check(){
    btn.disabled = !(name.value.trim().length>0 && age.value && +age.value>0 && +age.value<100);
  }
  name.oninput = check; age.oninput = check;
  btn.onclick = ()=>{
    saveProfile({name:name.value.trim(), age:+age.value});
    state.screen = "home";
    render();
  };
}

function renderHome(){
  const profile = loadProfile();
  const pct = Math.round(totalDone()/totalActivities()*100);
  app.innerHTML = `
    <header class="topbar">${catSVG(30)}<h1>Hola, ${profile.name} 👋</h1></header>
    <div class="content">
      <div class="card center">
        <span class="level-pill">${levelLabel()}</span>
        <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
        <p style="font-size:13px;color:var(--muted);margin:4px 0 0;">${totalDone()} / ${totalActivities()} actividades completadas</p>
      </div>
      <h3 style="margin:10px 4px;">Unidades</h3>
      ${UNITS.map((u,i)=>{
        const doneCount = SKILLS.filter(s=>isDone(i,s.key)).length;
        return `<div class="card unit-card" data-unit="${i}">
          <div class="unit-badge">${i+1}</div>
          <div style="flex:1;">
            <div class="unit-title">${u.title}</div>
            <div class="unit-sub">${u.level} · ${doneCount}/4 completado</div>
          </div>
          <div style="font-size:20px;">${doneCount===4?"✅":"➡️"}</div>
        </div>`;
      }).join("")}
    </div>`;
  document.querySelectorAll(".unit-card").forEach(el=>{
    el.onclick = ()=>{ state.screen="unit"; state.unitIndex=+el.dataset.unit; render(); };
  });
}

function renderUnitMenu(){
  const u = UNITS[state.unitIndex];
  app.innerHTML = `
    <header class="topbar"><button class="back" id="btnBack">←</button><h1>${u.title}</h1></header>
    <div class="content">
      <div class="card center">
        <span class="level-pill">${u.level}</span>
        <p style="font-size:14px;color:var(--muted);margin-top:8px;">Elige una habilidad para practicar</p>
      </div>
      <div class="skillgrid">
        ${SKILLS.map(s=>`
          <div class="skillbtn ${isDone(state.unitIndex,s.key)?"done":""}" data-skill="${s.key}">
            <span class="icon">${s.icon}</span>${s.label}
            ${isDone(state.unitIndex,s.key)?"<div style='font-size:11px;color:var(--green);margin-top:4px;'>Completado ✓</div>":""}
          </div>`).join("")}
      </div>
    </div>`;
  document.getElementById("btnBack").onclick = ()=>{ state.screen="home"; render(); };
  document.querySelectorAll(".skillbtn").forEach(el=>{
    el.onclick = ()=>{
      state.skill = el.dataset.skill;
      state.qIndex = 0;
      state.correctCount = 0;
      state.screen = state.skill;
      render();
    };
  });
}

function backToUnit(){ state.screen="unit"; render(); }

/* ---------- LECTURA ---------- */
function renderReading(){
  const u = UNITS[state.unitIndex];
  const total = u.reading.questions.length;
  if(state.qIndex >= total){ return finishSkill(); }
  const q = u.reading.questions[state.qIndex];
  app.innerHTML = `
    <header class="topbar"><button class="back" id="btnBack">←</button><h1>📖 Lectura</h1></header>
    <div class="content">
      ${state.qIndex===0?`<div class="passage">${u.reading.text}</div>`:""}
      <div class="card">
        <div class="qcounter">Pregunta ${state.qIndex+1} de ${total}</div>
        <p style="font-weight:700;">${q.q}</p>
        <div id="opts">
          ${q.options.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    </div>`;
  document.getElementById("btnBack").onclick = backToUnit;
  bindOptions(q.answer, ()=>{ state.qIndex++; render(); });
}

/* ---------- ESCRITURA ---------- */
function renderWriting(){
  const u = UNITS[state.unitIndex];
  const total = u.writing.length;
  if(state.qIndex >= total){ return finishSkill(); }
  const item = u.writing[state.qIndex];
  const parts = item.sentence.split("___");
  app.innerHTML = `
    <header class="topbar"><button class="back" id="btnBack">←</button><h1>✍️ Escritura</h1></header>
    <div class="content">
      <div class="card">
        <div class="qcounter">Frase ${state.qIndex+1} de ${total}</div>
        <p style="font-size:17px;">${parts[0]}<b style="color:var(--pink-darker);">___</b>${parts[1]||""}</p>
        <input type="text" id="wInput" placeholder="Escribe la palabra en inglés">
        <button class="btn" id="wCheck">Comprobar</button>
        <div class="feedback" id="fb"></div>
      </div>
    </div>`;
  document.getElementById("btnBack").onclick = backToUnit;
  const input = document.getElementById("wInput");
  const fb = document.getElementById("fb");
  document.getElementById("wCheck").onclick = ()=>{
    const val = input.value.trim().toLowerCase();
    const ok = item.answers.some(a=>a.toLowerCase()===val);
    if(ok){
      playCorrect();
      fb.className="feedback good"; fb.textContent="¡Correcto! 🎉";
      state.correctCount++;
      input.disabled = true;
      setTimeout(()=>{ state.qIndex++; render(); }, 900);
    } else {
      playWrong();
      fb.className="feedback bad"; fb.textContent="Casi... intenta de nuevo 🐾";
      input.classList.add("wrongflash");
    }
  };
}

/* ---------- ESCUCHA ---------- */
function renderListening(){
  const u = UNITS[state.unitIndex];
  const total = u.listening.length;
  if(state.qIndex >= total){ return finishSkill(); }
  const item = u.listening[state.qIndex];
  app.innerHTML = `
    <header class="topbar"><button class="back" id="btnBack">←</button><h1>🎧 Escucha</h1></header>
    <div class="content">
      <div class="card">
        <div class="qcounter">Audio ${state.qIndex+1} de ${total}</div>
        <button class="listen-btn" id="btnListen">🔊 Escuchar la frase</button>
        <p style="font-size:13px;color:var(--muted);margin-top:8px;">Elige la frase que escuchaste:</p>
        <div id="opts">
          ${item.options.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    </div>`;
  document.getElementById("btnBack").onclick = backToUnit;
  document.getElementById("btnListen").onclick = ()=> speakEnglish(item.audio);
  speakEnglish(item.audio);
  bindOptions(item.answer, ()=>{ state.qIndex++; render(); });
}

/* ---------- HABLA ---------- */
function renderSpeaking(){
  const u = UNITS[state.unitIndex];
  const total = u.speaking.length;
  if(state.qIndex >= total){ return finishSkill(); }
  const phrase = u.speaking[state.qIndex];
  const supported = speechSupported();
  app.innerHTML = `
    <header class="topbar"><button class="back" id="btnBack">←</button><h1>🗣️ Habla</h1></header>
    <div class="content">
      <div class="card center">
        <div class="qcounter" style="text-align:center;">Frase ${state.qIndex+1} de ${total}</div>
        <p style="font-size:13px;color:var(--muted);">Escucha y luego repítela en voz alta</p>
        <div class="speak-phrase">"${phrase}"</div>
        <button class="listen-btn" id="btnListen">🔊 Escuchar</button>
        ${supported ? `
          <button class="mic-btn" id="btnMic">🎤</button>
          <div class="transcript" id="transcript">Toca el micrófono y repite la frase</div>
          <div class="feedback" id="fb"></div>
        ` : `
          <p style="font-size:13px;color:var(--muted);margin-top:14px;">Tu navegador no soporta reconocimiento de voz. Repite la frase en voz alta y marca cuando termines.</p>
          <button class="btn" id="btnManual">Ya practiqué ✅</button>
        `}
      </div>
    </div>`;
  document.getElementById("btnBack").onclick = backToUnit;
  document.getElementById("btnListen").onclick = ()=> speakEnglish(phrase);
  if(supported){
    const micBtn = document.getElementById("btnMic");
    const transcriptEl = document.getElementById("transcript");
    const fb = document.getElementById("fb");
    micBtn.onclick = ()=>{
      micBtn.classList.add("listening");
      state._listening = true;
      transcriptEl.textContent = "Escuchando...";
      startRecognition(
        (text)=>{
          transcriptEl.textContent = `Escuché: "${text}"`;
          const score = similarity(text, phrase);
          micBtn.classList.remove("listening");
          if(score >= 0.5){
            playCorrect();
            fb.className="feedback good"; fb.textContent="¡Muy bien! 🎉";
            state.correctCount++;
            setTimeout(()=>{ state.qIndex++; render(); }, 1000);
          } else {
            playWrong();
            fb.className="feedback bad"; fb.textContent="Intenta de nuevo, tú puedes 🐾";
          }
        },
        (err)=>{
          micBtn.classList.remove("listening");
          transcriptEl.textContent = "No se detectó audio, intenta de nuevo.";
        }
      );
    };
  } else {
    document.getElementById("btnManual").onclick = ()=>{
      state.correctCount++;
      state.qIndex++; render();
    };
  }
}

/* ---------- Helpers de opciones múltiples ---------- */
function bindOptions(correctIndex, onNext){
  const opts = document.querySelectorAll("#opts .option");
  const fb = document.getElementById("fb");
  opts.forEach(btn=>{
    btn.onclick = ()=>{
      opts.forEach(b=>b.onclick=null);
      const i = +btn.dataset.i;
      if(i===correctIndex){
        btn.classList.add("correct");
        playCorrect();
        fb.className="feedback good"; fb.textContent="¡Correcto! 🎉";
        state.correctCount++;
      } else {
        btn.classList.add("wrong");
        opts[correctIndex].classList.add("correct");
        playWrong();
        fb.className="feedback bad"; fb.textContent="Esa no era... ¡sigue practicando! 🐾";
      }
      setTimeout(onNext, 1100);
    };
  });
}

function finishSkill(){
  markDone(state.unitIndex, state.skill);
  state.screen = "result";
  render();
}

function renderResult(){
  const skillMeta = SKILLS.find(s=>s.key===state.skill);
  const total = state.skill==="reading" ? UNITS[state.unitIndex].reading.questions.length
              : state.skill==="writing" ? UNITS[state.unitIndex].writing.length
              : state.skill==="listening" ? UNITS[state.unitIndex].listening.length
              : UNITS[state.unitIndex].speaking.length;
  const good = state.correctCount >= total*0.6;
  app.innerHTML = `
    <header class="topbar"><h1>Resultado</h1></header>
    <div class="content center">
      <div class="card">
        <div class="cat-wrap"><div class="${good?'catbounce':''}">${catSVG(100)}</div></div>
        <h2>${good ? "¡Excelente trabajo! 🎉" : "¡Buen intento! 💪"}</h2>
        <p style="color:var(--muted);">${skillMeta.label}: ${state.correctCount} / ${total} correctas</p>
        <button class="btn" id="btnAgain">Practicar de nuevo</button>
        <button class="btn secondary" id="btnMenu">Volver a la unidad</button>
      </div>
    </div>`;
  document.getElementById("btnAgain").onclick = ()=>{
    state.qIndex=0; state.correctCount=0; state.screen=state.skill; render();
  };
  document.getElementById("btnMenu").onclick = backToUnit;
}

render();
</script>
</body>
</html>
